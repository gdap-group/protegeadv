name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint, Typecheck e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar Dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar Lint (ESLint)
        run: pnpm lint

      - name: Checagem de Tipos Estrita (TypeScript)
        run: pnpm typecheck

      - name: Rodar Testes Automatizados (Vitest)
        run: pnpm test
